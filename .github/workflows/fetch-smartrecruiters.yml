name: Refresh SmartRecruiters jobs

# The SmartRecruiters third of the board. Its own workflow, like Ashby's.
#
# The three fetchers cannot corrupt each other: every sweep is scoped by `ats`, so this
# one only ever deletes `ats: 'smartrecruiters'` rows. That scoping is what makes running
# them independently safe — if any sweep is ever widened, all three need revisiting.
on:
  schedule:
    # Every 4 hours at :15, offset from Greenhouse (:00) and Ashby (:30) so no two are
    # writing to Mongo at the same moment. GitHub queues scheduled runs on a best-effort
    # basis so the exact minute drifts; the offset is a nudge, not a guarantee, and
    # nothing depends on it.
    #
    # Four hours rather than Ashby's two because this is the expensive one. Descriptions
    # are not included in the job list, so each posting that survives the age and location
    # gates costs its own request — about 15,000 detail calls per run on top of 1,100 list
    # calls. Ashby is 585 requests in total.
    - cron: '15 */4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-smartrecruiters
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A measured run is ~22 minutes. 60 leaves room for a slow day while still failing
    # rather than hanging for hours.
    timeout-minutes: 300

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        # Same fallback as the other two workflows: `npm ci` needs a lockfile and fails
        # without one, which would silently break every scheduled run.
        run: npm ci || npm install

      - name: Fetch and sweep SmartRecruiters jobs
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Filename is case-sensitive on Linux. Reads sr_companies.txt and sr_names.json
        # from the same folder.
        run: node fetchSR.mjs


      # ── FAILURE ALARM ─────────────────────────────────────────────────────
      # Runs ONLY when a step above failed. Opens a GitHub issue named after this
      # workflow; GitHub emails the repo owner when an issue opens, so a broken
      # fetcher becomes an email instead of a silently stale board. A repeat
      # failure comments on the existing issue rather than opening another.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          BODY="Run: $RUN_URL
          Failed at: $(date -u '+%Y-%m-%d %H:%M UTC')

          The board stops getting this source's jobs until this is fixed. The sweep guard prevents deletions, so nothing is lost - but nothing is fresh either."
          EXISTING=$(gh issue list -R ${{ github.repository }} --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment -R ${{ github.repository }} "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create -R ${{ github.repository }} --title "$TITLE" --body "$BODY"
          fi

# The alarm step opens issues; without this the token is read-only and the alarm
# itself fails with a 403.
permissions:
  contents: read
  issues: write
