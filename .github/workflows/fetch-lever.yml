name: Refresh Lever jobs

# The Lever quarter of the board. Separate from the other three workflows for the
# same reason they are separate from each other: every sweep is scoped by `ats`, so
# this run only ever deletes `ats: 'lever'` rows. A failure here stops nothing else,
# and a 26-minute Greenhouse run never blocks this one.
#
# WHAT THE DRY RUN SAID BEFORE THIS WAS SCHEDULED (2026-09-01)
#   303 boards, ~18,000 postings seen, ~1,200 kept. 83% fall to the 30-day age gate —
#   Lever boards keep old postings up indefinitely. The load is light: 303 requests
#   at 6 concurrent takes about a minute.
on:
  schedule:
    # Every 2 hours, offset 45 minutes so it does not land on the Greenhouse (:00)
    # or Ashby (:30) runs. Best-effort scheduling means the minute drifts; the offset
    # is a nudge, nothing depends on it. Two-hourly for the same reason Ashby is:
    # it is a tenth of the Greenhouse load and can absorb the faster cycle.
    - cron: '45 */2 * * *'
  workflow_dispatch:

# One Lever run at a time. The run ends by DELETING Lever jobs it did not see at the
# source; two at once means one can delete rows the other just saved.
# cancel-in-progress stays false — killing a run mid-delete is worse than waiting.
concurrency:
  group: refresh-lever
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # About a minute in practice. 20 fails fast if Lever starts hanging.
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        # Same fallback as the other workflows: `npm ci` needs a lockfile.
        run: npm ci || npm install

      - name: Fetch and sweep Lever jobs
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Filename is case-sensitive on Linux — lowercase f, matching the repo.
        # Reads lever_boards.txt and lever_names.json from the same folder.
        run: node fetchLever.mjs

      # ── FAILURE ALARM ─────────────────────────────────────────────────────
      # Runs ONLY when a step above failed. Opens a GitHub issue named after this
      # workflow; GitHub emails the repo owner when an issue opens, so a broken
      # fetcher becomes an email instead of a silently stale board. A repeat
      # failure comments on the existing issue rather than opening another.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          BODY="Run: $RUN_URL
          Failed at: $(date -u '+%Y-%m-%d %H:%M UTC')

          The board stops getting this source's jobs until this is fixed. The sweep guard prevents deletions, so nothing is lost - but nothing is fresh either."
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

# The alarm step opens issues; without this the token is read-only and the alarm
# itself fails with a 403.
permissions:
  contents: read
  issues: write
