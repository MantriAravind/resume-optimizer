name: Test alarm (delete after it works)

# Fails on purpose. Exists to prove the failure alarm produces a GitHub issue and
# an email BEFORE any real fetcher depends on it. Run it once by hand, confirm the
# issue and the email arrive, close the issue, delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fail-on-purpose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail deliberately
        run: |
          echo "This step fails on purpose to test the alarm."
          exit 1

      # ── FAILURE ALARM ─────────────────────────────────────────────────────
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          BODY="Run: $RUN_URL
          Failed at: $(date -u '+%Y-%m-%d %H:%M UTC')

          The board stops getting this source's jobs until this is fixed. The sweep guard prevents deletions, so nothing is lost — but nothing is fresh either."
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
