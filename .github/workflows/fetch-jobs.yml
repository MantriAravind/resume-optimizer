name: Refresh job board

# Runs the Greenhouse pipeline: adds new jobs, updates existing ones, and sweeps
# jobs that no longer exist at the source.
on:
  schedule:
    # Every 4 hours, on the hour (UTC). Was 6 — the fetch-time age gate cut the run
    # from 2h08m to roughly 26 minutes, so a 4-hour cycle has plenty of headroom and
    # new postings reach the board sooner. GitHub queues scheduled runs on a
    # best-effort basis, so the exact minute drifts.
    - cron: '0 */4 * * *'
  # Lets you trigger it by hand from the Actions tab.
  workflow_dispatch:

# Only one pipeline may run at a time.
#
# Why this matters: at the end of every run the pipeline DELETES jobs it did not see
# at the source. Two runs at once means one can delete rows the other just saved,
# because each only knows about the jobs it fetched itself.
#
# cancel-in-progress is false on purpose. Cancelling would kill a run partway through
# its delete pass, which is worse than making the new run wait its turn. A queued run
# starts the moment the current one finishes.
concurrency:
  group: refresh-job-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The pipeline walks every company slug with rate-limit pauses, so give it room.
    # The age gate brought a typical run down to ~26 minutes; this ceiling stays high
    # so a slow day does not kill a run that would have finished, but it is now far
    # above normal rather than close to it.
    timeout-minutes: 180

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        # `npm ci` needs a lockfile and fails without one. Fall back to `npm install`
        # so a missing package-lock.json doesn't silently break every scheduled run.
        run: npm ci || npm install

      - name: Fetch and sweep jobs
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Filename is case-sensitive on Linux. This must match the file in the repo
        # exactly: FetchJobs.mjs with a capital F.
        run: node FetchJobs.mjs
